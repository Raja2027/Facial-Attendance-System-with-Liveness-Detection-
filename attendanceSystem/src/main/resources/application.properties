spring.application.name=attendanceSystem
spring.data.mongodb.uri=${MONGODB_URI}
ai.server.url=${AI_SERVER_URL:http://localhost:5001}

app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin123}
app.security.jwt-secret=${JWT_SECRET:change-this-secret-in-render-to-at-least-32-characters}
app.security.jwt-ttl-minutes=${JWT_TTL_MINUTES:480}

app.rate-limit.mark-attendance-per-minute=${RATE_LIMIT_ATTENDANCE_PER_MINUTE:30}
app.rate-limit.register-per-minute=${RATE_LIMIT_REGISTER_PER_MINUTE:6}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
server.forward-headers-strategy=framework

logging.level.com.example.attendancesystem=INFO

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | BioPass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-gradient {
            background: linear-gradient(-45deg, #43c6ac, #191654, #43c6ac, #191654);
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
        }
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="animate-gradient min-h-screen text-slate-200 flex items-center justify-center p-4 font-sans">
<main class="glass w-full max-w-md rounded-[2rem] p-10">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-black text-white tracking-tight">BIOPASS</h1>
        <p class="text-emerald-400 text-[10px] font-black uppercase tracking-[0.3em] mt-2">Secure Console</p>
    </div>

    <form id="login-form" class="space-y-5">
        <div>
            <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-2">Username</label>
            <input id="username" autocomplete="username" class="w-full bg-black/20 border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:ring-4 focus:ring-emerald-500/10" required>
        </div>
        <div>
            <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-2">Password</label>
            <input id="password" type="password" autocomplete="current-password" class="w-full bg-black/20 border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:ring-4 focus:ring-emerald-500/10" required>
        </div>
        <p id="message" class="min-h-5 text-sm text-red-300"></p>
        <button class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-black py-5 rounded-2xl shadow-xl shadow-emerald-900/20 uppercase tracking-widest text-sm" type="submit">
            Sign In
        </button>
    </form>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get("next") || "dashboard.html";

    document.getElementById("login-form").addEventListener("submit", async event => {
        event.preventDefault();
        const message = document.getElementById("message");
        message.innerText = "";

        const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();
        if (!response.ok) {
            message.innerText = data.error || "Login failed";
            return;
        }

        localStorage.setItem("authToken", data.token);
        localStorage.setItem("authExpiresAt", data.expiresAt);
        window.location.href = next;
    });
</script>
</body>
</html>

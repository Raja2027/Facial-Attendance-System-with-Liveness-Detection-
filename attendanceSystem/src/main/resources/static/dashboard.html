<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioPass Pro | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #eef5f2;
        }

        .panel {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        }

        .stat {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.08);
        }
    </style>
</head>

<body class="min-h-screen text-slate-900 font-sans">
<main class="max-w-7xl mx-auto px-5 py-6 space-y-6">
    <header class="flex flex-wrap gap-4 items-center justify-between">
        <div>
            <p class="text-xs font-black uppercase tracking-[0.3em] text-emerald-600">BioPass Pro</p>
            <h1 class="text-3xl font-black tracking-tight text-slate-950 mt-1">Admin Dashboard</h1>
        </div>
        <div class="flex flex-wrap gap-3">
            <a href="register.html" class="px-4 py-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold">Register User</a>
            <a href="index.html" class="px-4 py-3 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold">Kiosk Home</a>
            <button onclick="logout()" class="px-4 py-3 rounded-lg bg-white hover:bg-slate-50 text-slate-700 text-sm font-bold border border-slate-200">Logout</button>
        </div>
    </header>

    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="stat rounded-lg p-5">
            <p class="text-xs font-black uppercase tracking-widest text-slate-500">Students</p>
            <p id="total-students" class="text-4xl font-black mt-3">0</p>
        </div>
        <div class="stat rounded-lg p-5">
            <p class="text-xs font-black uppercase tracking-widest text-slate-500">Teachers</p>
            <p id="total-teachers" class="text-4xl font-black mt-3">0</p>
        </div>
        <div class="stat rounded-lg p-5">
            <p class="text-xs font-black uppercase tracking-widest text-slate-500">Total Users</p>
            <p id="total-people" class="text-4xl font-black mt-3">0</p>
        </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-[1fr_1.35fr] gap-5">
        <div class="panel rounded-lg p-5">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-black">Registered Users</h2>
                <button onclick="loadDashboard()" class="px-3 py-2 rounded-lg bg-white border border-slate-200 text-xs font-bold">Refresh</button>
            </div>
            <div class="overflow-auto max-h-[520px]">
                <table class="w-full text-sm">
                    <thead class="text-left text-xs uppercase tracking-widest text-slate-500">
                    <tr>
                        <th class="py-3 pr-3">Name</th>
                        <th class="py-3 pr-3">Role</th>
                        <th class="py-3">Reg No</th>
                    </tr>
                    </thead>
                    <tbody id="people-table" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>
        </div>

        <div class="panel rounded-lg p-5">
            <div class="flex flex-wrap gap-3 items-center justify-between mb-4">
                <h2 class="text-lg font-black">Attendance Logs</h2>
                <div class="flex gap-2">
                    <button onclick="loadAttendance('all')" class="filter-btn px-3 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold" data-filter="all">All</button>
                    <button onclick="loadAttendance('student')" class="filter-btn px-3 py-2 rounded-lg bg-white border border-slate-200 text-xs font-bold" data-filter="student">Students</button>
                    <button onclick="loadAttendance('faculty')" class="filter-btn px-3 py-2 rounded-lg bg-white border border-slate-200 text-xs font-bold" data-filter="faculty">Teachers</button>
                </div>
            </div>
            <div class="overflow-auto max-h-[520px]">
                <table class="w-full text-sm">
                    <thead class="text-left text-xs uppercase tracking-widest text-slate-500">
                    <tr>
                        <th class="py-3 pr-3">Time</th>
                        <th class="py-3 pr-3">Name</th>
                        <th class="py-3 pr-3">Role</th>
                        <th class="py-3">Status</th>
                    </tr>
                    </thead>
                    <tbody id="attendance-table" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>
        </div>
    </section>

    <p id="message" class="text-sm font-semibold text-red-600 min-h-5"></p>
</main>

<script>
    function token() {
        const authToken = localStorage.getItem("authToken");
        const expiresAt = localStorage.getItem("authExpiresAt");
        if (!authToken || (expiresAt && new Date(expiresAt) <= new Date())) {
            logout();
            return null;
        }
        return authToken;
    }

    function logout() {
        localStorage.removeItem("authToken");
        localStorage.removeItem("authExpiresAt");
        window.location.href = "login.html?next=dashboard.html";
    }

    async function api(path) {
        const authToken = token();
        if (!authToken) return null;

        const response = await fetch(path, {
            headers: { "Authorization": "Bearer " + authToken }
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return null;
        }

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || "Request failed");
        }
        return data;
    }

    function roleLabel(type) {
        return type && type.toLowerCase() === "faculty" ? "Teacher" : "Student";
    }

    function formatDate(value) {
        if (!value) return "-";
        return new Date(value).toLocaleString();
    }

    async function loadDashboard() {
        try {
            document.getElementById("message").innerText = "";
            const [summary, people] = await Promise.all([
                api("/admin/summary"),
                api("/admin/people")
            ]);
            if (!summary || !people) return;

            document.getElementById("total-students").innerText = summary.totalStudents;
            document.getElementById("total-teachers").innerText = summary.totalTeachers;
            document.getElementById("total-people").innerText = summary.totalPeople;

            document.getElementById("people-table").innerHTML = people.map(person => `
                <tr>
                    <td class="py-3 pr-3 font-bold">${person.name || "-"}</td>
                    <td class="py-3 pr-3">${roleLabel(person.type)}</td>
                    <td class="py-3 font-mono text-xs">${person.registrationNumber || "-"}</td>
                </tr>
            `).join("") || `<tr><td class="py-4 text-slate-500" colspan="3">No users registered yet</td></tr>`;

            renderAttendance(summary.recentAttendance || []);
        } catch (error) {
            document.getElementById("message").innerText = error.message;
        }
    }

    async function loadAttendance(type) {
        try {
            document.querySelectorAll(".filter-btn").forEach(button => {
                const active = button.dataset.filter === type;
                button.className = active
                    ? "filter-btn px-3 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold"
                    : "filter-btn px-3 py-2 rounded-lg bg-white border border-slate-200 text-xs font-bold";
            });

            const logs = await api("/admin/attendance?type=" + encodeURIComponent(type));
            if (logs) renderAttendance(logs);
        } catch (error) {
            document.getElementById("message").innerText = error.message;
        }
    }

    function renderAttendance(logs) {
        document.getElementById("attendance-table").innerHTML = logs.map(log => `
            <tr>
                <td class="py-3 pr-3 whitespace-nowrap">${formatDate(log.markedAt)}</td>
                <td class="py-3 pr-3 font-bold">${log.name || "-"}</td>
                <td class="py-3 pr-3">${roleLabel(log.type)}</td>
                <td class="py-3">
                    <span class="px-2 py-1 rounded-md bg-emerald-100 text-emerald-700 text-xs font-black">${log.status || "-"}</span>
                </td>
            </tr>
        `).join("") || `<tr><td class="py-4 text-slate-500" colspan="4">No attendance logs yet</td></tr>`;
    }

    loadDashboard();
</script>
</body>

</html>

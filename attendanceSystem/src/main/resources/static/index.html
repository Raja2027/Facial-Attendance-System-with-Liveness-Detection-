<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioPass Pro | Attendance Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-gradient {
            background: linear-gradient(-45deg, #4ca1af, #c4e0e5, #43c6ac, #eef5f2);
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
        }

        .glass {
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.14);
        }
    </style>
</head>

<body class="animate-gradient min-h-screen text-slate-900 flex items-center justify-center p-5 font-sans">
<main class="glass w-full max-w-3xl rounded-[2rem] p-8 md:p-12">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-8">
        <section>
            <p class="text-xs font-black uppercase tracking-[0.35em] text-emerald-700">BioPass Pro</p>
            <h1 class="text-4xl md:text-6xl font-black tracking-tight mt-3 text-white drop-shadow-sm">Attendance Kiosk</h1>
            <p class="text-sm md:text-base font-semibold text-slate-700 mt-4 max-w-md">
                Public face scanner for automatic attendance marking. Admin access is only for registration and dashboard review.
            </p>
        </section>

        <section class="w-full md:w-72 space-y-3">
            <a href="attendance.html" class="block w-full text-center rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-5 font-black uppercase tracking-widest text-sm shadow-xl shadow-emerald-900/10">
                Mark Attendance
            </a>
            <a href="login.html?next=dashboard.html" class="block w-full text-center rounded-xl bg-white hover:bg-slate-50 text-slate-800 px-5 py-4 font-black uppercase tracking-widest text-xs border border-white/60">
                Admin Login
            </a>
        </section>
    </div>
</main>
</body>

</html>

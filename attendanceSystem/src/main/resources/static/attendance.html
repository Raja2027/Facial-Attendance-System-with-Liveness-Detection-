<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | Face Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-gradient {
            background: linear-gradient(-45deg, #43c6ac, #191654, #43c6ac, #191654);
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
        }
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .square-container {
            width: min(90vw, 80vh);
            height: min(90vw, 80vh);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 30;
        }
    </style>
</head>

<body class="animate-gradient min-h-screen text-slate-200 flex flex-col items-center justify-center p-4 font-sans overflow-hidden">

<div class="max-w-md w-full glass rounded-[2.5rem] p-10 square-container shadow-2xl relative overflow-hidden flex flex-col justify-center">

    <div class="flex justify-between items-center mb-4 px-2">
        <p class="text-emerald-400 font-black tracking-[0.3em] uppercase text-xs opacity-90">Attendance Marking</p>
        <a href="index.html" class="text-[10px] font-black text-white/40 hover:text-white transition uppercase tracking-widest">Hub</a>
    </div>

    <div class="mb-3 px-2 text-center">
        <p id="status" class="text-sm font-semibold tracking-widest uppercase text-white/50">Loading models...</p>
    </div>

    <div class="relative w-full aspect-square rounded-[2rem] overflow-hidden border-4 border-white/10 bg-black/30 shadow-2xl">
        <video id="video" class="w-full h-full object-cover scale-x-[-1]" autoplay muted playsinline></video>
        <canvas id="overlay" class="scale-x-[-1]"></canvas>
    </div>

</div>

<script>
    function requireAuth() {
        const token = localStorage.getItem("authToken");
        if (!token) {
            window.location.href = "login.html?next=attendance.html";
            return null;
        }
        return token;
    }

    const authToken = requireAuth();

    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const statusText = document.getElementById("status");

    let isProcessing = false;
    let modelsReady = false;

    // Load tiny face detector model from CDN
    const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model";

    async function loadModels() {
        try {
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            modelsReady = true;
            statusText.innerText = "System Ready";
            startCamera();
        } catch (e) {
            statusText.innerText = "Failed to load face model";
            console.error(e);
        }
    }

    function startCamera() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    runDetectionLoop();
                    setInterval(triggerAttendance, 2000);
                };
            })
            .catch(err => {
                statusText.innerText = "Camera access denied";
                console.error(err);
            });
    }

    // scoreThreshold 0.6 = only confident real-face detections pass
    const detectorOptions = new faceapi.TinyFaceDetectorOptions({
        inputSize: 320,
        scoreThreshold: 0.6
    });

    let lastDetections = [];

    // Overlay loop ~12fps — draws boxes only on confidently detected faces
    async function runDetectionLoop() {
        async function loop() {
            if (modelsReady && video.readyState === 4) {
                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;

                const detections = await faceapi.detectAllFaces(video, detectorOptions);
                lastDetections = detections;

                ctx.clearRect(0, 0, overlay.width, overlay.height);
                detections.forEach(det => {
                    const { x, y, width, height } = det.box;
                    drawFaceBox(ctx, x, y, width, height);
                });

                if (detections.length === 0 && !isProcessing) {
                    statusText.innerText = "No face detected";
                }
            }
            setTimeout(loop, 80);
        }
        loop();
    }

    // Only sends to API when a real face is confidently detected
    async function triggerAttendance() {
        if (isProcessing || !modelsReady || lastDetections.length === 0) return;

        isProcessing = true;
        statusText.innerText = "Face detected. Authenticating...";

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);

        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append("file", blob);

            fetch("/persons/mark-attendance", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + authToken
                },
                body: formData
            })
                .then(res => {
                    if (res.status === 401 || res.status === 403) {
                        localStorage.removeItem("authToken");
                        window.location.href = "login.html?next=attendance.html";
                        return Promise.reject(new Error("Unauthorized"));
                    }
                    return res.json();
                })
                .then(data => {
                    if (data.status === "success") {
                        statusText.innerText = "✓ Present: " + data.name + (data.regNo ? " (" + data.regNo + ")" : "");
                    } else {
                        statusText.innerText = "✗ Identity Unknown";
                    }
                    setTimeout(() => {
                        isProcessing = false;
                        statusText.innerText = "System Ready";
                    }, 3000);
                })
                .catch(err => {
                    statusText.innerText = "Communication Error";
                    console.error(err);
                    setTimeout(() => { isProcessing = false; statusText.innerText = "System Ready"; }, 3000);
                });
        }, "image/jpeg");
    }

    function drawFaceBox(ctx, x, y, w, h) {
        const len = Math.min(w, h) * 0.2;
        ctx.strokeStyle = "#10b981";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(16, 185, 129, 0.6)";
        ctx.beginPath();
        ctx.moveTo(x, y + len);         ctx.lineTo(x, y);           ctx.lineTo(x + len, y);
        ctx.moveTo(x + w - len, y);     ctx.lineTo(x + w, y);       ctx.lineTo(x + w, y + len);
        ctx.moveTo(x, y + h - len);     ctx.lineTo(x, y + h);       ctx.lineTo(x + len, y + h);
        ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h);   ctx.lineTo(x + w, y + h - len);
        ctx.stroke();
    }

    loadModels();
</script>
</body>
</html>

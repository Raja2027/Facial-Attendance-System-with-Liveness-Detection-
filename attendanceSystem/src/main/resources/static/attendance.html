<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>
    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body>

<h2>Face Attendance</h2>

<video id="video" width="400" autoplay></video>
<br><br>

<h3 id="status">Loading OpenCV...</h3>

<script>

    let video = document.getElementById("video");
    let statusText = document.getElementById("status");

    let faceCascade;
    let cvReady = false;
    let isProcessing = false;

    // Wait for OpenCV
    function waitForOpenCV() {
        if (typeof cv !== "undefined" && cv.Mat) {
            initializeFaceDetection();
        } else {
            setTimeout(waitForOpenCV, 100);
        }
    }

    waitForOpenCV();

    function initializeFaceDetection() {

        fetch('/haarcascade_frontalface_default.xml')
            .then(response => response.arrayBuffer())
            .then(data => {

                const bytes = new Uint8Array(data);
                cv.FS_createDataFile('/', 'face.xml', bytes, true, false);

                faceCascade = new cv.CascadeClassifier();
                faceCascade.load('face.xml');

                cvReady = true;
                statusText.innerText = "System Ready";

                startScanning();

            });
    }

    // Start Camera
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            statusText.innerText = "Camera access denied";
        });

    function startScanning() {
        setInterval(() => {
            if (!isProcessing && cvReady) {
                detectAndProcess();
            }
        }, 2000);
    }

    function detectAndProcess() {

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);

        let src = cv.imread(canvas);
        let gray = new cv.Mat();
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

        let faces = new cv.RectVector();
        let msize = new cv.Size(0, 0);

        faceCascade.detectMultiScale(gray, faces, 1.1, 3, 0, msize, msize);

        if (faces.size() === 0) {
            statusText.innerText = "No face detected";
            src.delete(); gray.delete(); faces.delete();
            return;
        }

        isProcessing = true;
        statusText.innerText = "Face detected. Processing...";

        canvas.toBlob(blob => {

            const formData = new FormData();
            formData.append("file", blob);

            fetch("/persons/mark-attendance", {
                method: "POST",
                body: formData
            })
                .then(res => res.json())
                .then(data => {

                    if (data.status === "success") {
                        statusText.innerText =
                            "Present: " + data.name + " (" + data.regNo + ")";
                    } else {
                        statusText.innerText = "No Match";
                    }

                    isProcessing = false;

                })
                .catch(err => {
                    statusText.innerText = "Error";
                    isProcessing = false;
                });

        }, "image/jpeg");

        src.delete();
        gray.delete();
        faces.delete();
    }

</script>

</body>
</html>
